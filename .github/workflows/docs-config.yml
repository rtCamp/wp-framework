name: Validate documentation configuration

on:
  push:
    branches: [docs-config]
  pull_request:
    branches: [docs-config]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: docs-config-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test configuration and build main documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      DOCS_SOURCE: ${{ github.workspace }}/source
      DOCS_DIRECTORY: docs
      DOCS_SOURCE_REF: main
      NO_UPDATE_NOTIFIER: '1'
    steps:
      - name: Checkout configuration revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          persist-credentials: false

      - name: Checkout documentation from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Test source resolution and repository links
        run: npm test

      - name: Build documentation
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      # Validation only during setup. Production deployment will be integrated
      # with the main-branch workflow after this configuration branch is ready.
      - name: Upload validation artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: docs-config-preview
          path: site/build/
          retention-days: 7
