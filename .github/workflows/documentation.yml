name: Documentation

on:
  push:
    # Temporary deployment test branch; remove after verification.
    branches: [main, gh/92-documentation]
    paths:
      - 'docs/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Build and publish documentation
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: rtCamp/wp-shared-workflows/.github/workflows/documentation.yml@v1.0.0/task/documentation-site
    with:
      # Keep the builder checkout aligned with the reusable workflow revision.
      tooling-ref: v1.0.0/task/documentation-site
      # Temporary deployment test branch; replace with main after verification.
      source-branch: ${{ github.ref_name == 'gh/92-documentation' && 'gh/92-documentation' || 'main' }}
      site-title: ${{ vars.DOCS_SITE_TITLE }}
      site-config: ${{ vars.DOCS_SITE_CONFIG }}
